name: Construire et publier le site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Régénérer les guides complets depuis les chapitres
        run: python "build-guides-complets.py"

      - name: Construire le site
        run: python build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Le delai par defaut (10 min) a deja expire une fois en attendant
          # que Pages confirme la mise en ligne, alors que la construction
          # etait bonne. On laisse plus de marge.
          timeout: 1800000
          error_count: 15
