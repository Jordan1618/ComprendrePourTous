{{ if or .PrevInSection .NextInSection }}
<nav class="prev-next" aria-label="Navigation entre chapitres">
  {{ with .PrevInSection }}
  <a class="prev-next-link prev" href="{{ .RelPermalink }}">
    <span class="prev-next-label">← Précédent</span>
    <span class="prev-next-title">{{ .Title }}</span>
  </a>
  {{ else }}
  <span></span>
  {{ end }}
  {{ with .NextInSection }}
  <a class="prev-next-link next" href="{{ .RelPermalink }}">
    <span class="prev-next-label">Suivant →</span>
    <span class="prev-next-title">{{ .Title }}</span>
  </a>
  {{ end }}
</nav>
{{ end }}
