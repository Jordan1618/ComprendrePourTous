<!doctype html>
<html lang="{{ .Site.Language.Lang | default "fr" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 160 }}{{ end }}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0f172a">
  <link rel="stylesheet" href="{{ "css/style.css" | absURL }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.85em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      if (saved) document.documentElement.setAttribute("data-theme", saved);
    })();
  </script>
</head>
<body>
  <input type="checkbox" id="nav-toggle" class="nav-toggle">

  <header class="site-header">
    <label for="nav-toggle" class="burger" aria-label="Ouvrir le menu">
      <span></span><span></span><span></span>
    </label>
    <a class="brand" href="{{ "/" | absURL }}">
      <span class="brand-mark">📖</span>
      <span class="brand-text">{{ .Site.Title }}</span>
    </a>
    <div class="header-spacer"></div>
    <button type="button" class="theme-toggle" aria-label="Changer de thème">
      <span class="icon-sun">☀️</span><span class="icon-moon">🌙</span>
    </button>
  </header>

  <div class="layout">
    <label for="nav-toggle" class="nav-scrim"></label>
    <nav class="sidebar" aria-label="Navigation principale">
      {{ partial "nav.html" . }}
    </nav>

    <main class="content">
      {{ block "main" . }}{{ end }}
    </main>
  </div>

  <footer class="site-footer">
    <p>
      Textes publiés sous licence <a href="https://creativecommons.org/licenses/by/4.0/deed.fr" target="_blank" rel="noopener">CC BY 4.0</a>.
      {{ with .Site.Params.repo }}<a href="{{ . }}" target="_blank" rel="noopener">Code source</a>{{ end }}
    </p>
  </footer>

  <script src="{{ "js/app.js" | absURL }}" defer></script>
</body>
</html>
